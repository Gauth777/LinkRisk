name: integrate-protection-ui

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-protection-ui.yml'
      - 'scripts/apply_protection_ui_patch.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Integrate protection panel
        run: python scripts/apply_protection_ui_patch.py
      - name: Commit integration
        run: |
          if git diff --quiet -- frontend/src/App.tsx; then
            echo 'Protection UI already integrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.tsx
          git commit -m 'feat: integrate merchant protection into investigations'
          git push origin main
