name: apply-analyst-jane

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-analyst-jane.yml'
      - 'scripts/apply_analyst_jane_patch.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply analyst Jane patch
        run: python scripts/apply_analyst_jane_patch.py
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo 'Analyst Jane patch already integrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/linkrisk/live_engine_v2.py backend/api.py backend/session_store.py frontend/src/App.tsx frontend/src/api.ts frontend/src/types.ts tests/test_live_engine_v2.py
          git commit -m 'feat: add analyst-requested Jane second opinion'
          git push origin main
